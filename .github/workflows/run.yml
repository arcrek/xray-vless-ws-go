name: VLESS Reality FRP (Go)
on:
  workflow_dispatch:
    inputs:
      bridge_workflows:
        description: "Bridge the workflows"
        default: false
        required: false
        type: boolean

jobs:
  run-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Building from source here rather than downloading a prebuilt release
      # binary: this project doesn't publish GitHub Releases yet (that's an
      # optional follow-up, see go/README.md's Cross-compilation section).
      # Once releases exist, swap this step for a checksum-verified binary
      # download — faster (no Go toolchain setup) and doesn't require
      # trusting the runner's build environment for every run.
      - name: Build xrayws
        run: go build -o xrayws ./cmd/xrayws

      - name: Run
        env:
          BRIDGE_WORKFLOWS: ${{ github.event.inputs.bridge_workflows }}
          ENV_CONFIG: ${{ secrets.ENV_CONFIG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./xrayws --ci-mode
